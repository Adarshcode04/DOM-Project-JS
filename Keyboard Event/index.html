<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Event Demo</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #e8e1d5;
        font-family: Georgia, serif;
      }
      .main {
        background: #fffdf8;
        padding: 40px;
        border: 2px solid black;
        border-radius: 10px;
        box-shadow: 8px 8px 0 black;
        width: 400px;
        max-width: 80%;
        text-align: center;
      }
      h1 {
        color: #222;
        margin-top: 0;
        font-size: 32px;
      }
      p {
        color: #555;
        margin-bottom: 25px;
      }
      input {
        padding: 20px;
        margin: 8px 0;
        width: 100%;
        box-sizing: border-box;
        border: 2px solid black;
        border-radius: 5px;
        box-shadow: 3px 3px 0 #777;
        font-family: inherit;
        font-size: 16px;
      }
      input:focus {
        outline: none;
        box-shadow: 5px 5px 0 #e76f51;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h1>Keyboard Event Demo</h1>
      <p>click the input box and press keys</p>
      <input id="input-box" type="text" placeholder="Type something..." />
      <br />

      <input id="input-box2" type="text" placeholder="Press a key..." />
    </div>

    <script>
      const inputBox = document.getElementById("input-box");
      const inputBox2 = document.getElementById("input-box2");

      inputBox.addEventListener("keydown", function (event) {
        console.log("Key pressed:", event.key);
        inputBox2.value = event.key;
      });

      inputBox2.addEventListener("keydown", function (event) {
        console.log("Second input key:", event.key);
        inputBox.value = inputBox.value + event.key;
      });
    </script>
  </body>
</html>
