<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards of Shopping</title>

    <style>
      body {
        background-color: rgb(195, 189, 189);
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .card-container {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        max-width: 1200px;
        margin: 0 auto;
      }

      .card {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      }

      .card-image {
        width: 100%;
        height: 220px;
        object-fit: contain;
        border-radius: 10px;
        background-color: #f5f5f5;
      }

      .card h2 {
        margin-bottom: 10px;
      }

      .card p {
        margin: 8px 0;
      }

      .price {
        font-weight: bold;
        color: green;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Products</h1>

    <div class="card-container"></div>

    <script>
      const products = [
        {
          name: "Laptop",
          brand: "Dell",
          price: "₹65,000",
          category: "Electronics",
          image:
            "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",
        },

        {
          name: "iPhone",
          brand: "Apple",
          price: "₹80,000",
          category: "Mobile",
          image:
            "https://rukminim2.flixcart.com/image/312/312/xif0q/mobile/s/t/g/-original-imahft5gqkxzyeqa.jpeg?q=70",
        },

        {
          name: "Shoes",
          brand: "Nike",
          price: "₹4,000",
          category: "Fashion",
          image:
            "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",
        },

        {
          name: "Headphones",
          brand: "Sony",
          price: "₹5,500",
          category: "Electronics",
          image:
            "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",
        },

        {
          name: "Watch",
          brand: "Titan",
          price: "₹3,500",
          category: "Accessories",
          image:
            "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=500",
        },
      ];

      const cardContainer = document.querySelector(".card-container");
      products.forEach((product) => {
        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
                <img 
                    class="card-image"
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="this.src='https://placehold.co/500x300?text=No+Image'"
                >
                <h2>${product.name}</h2>
                <p><strong>Brand:</strong> ${product.brand}</p>
                <p class="price">${product.price}</p>
                <p><strong>Category:</strong> ${product.category}</p>
            `;
        cardContainer.appendChild(card);
      });
    </script>
  </body>
</html>
