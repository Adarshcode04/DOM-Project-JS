<!doctype html>
<html lang="en">
  <head>
    <title>To-Do List Builder</title>

    <style>
      body {
        /* display: flex; */
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        padding: 40px;
      }

      input,
      button {
        padding: 10px;
        margin: 5px;
      }

      ul {
        margin-top: 20px;
        padding-left: 20px;
      }

      li {
        margin: 10px 0;
      }

      .delete-btn {
        margin-left: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        background: rgb(244, 8, 8);
        border: none;
        padding: 4px 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>To-Do List Builder</h1>

    <input type="text" id="todo-input" placeholder="Enter Task" />

    <button id="add-btn">Add</button>
    <button id="duplicate-btn">Duplicate Last</button>
    <button id="priority-btn">Insert at Top</button>
    <ul id="todo-list"></ul>

    <script>
      const input = document.getElementById("todo-input");
      const addBtn = document.getElementById("add-btn");
      const duplicateBtn = document.getElementById("duplicate-btn");
      const priorityBtn = document.getElementById("priority-btn");
      const todoList = document.getElementById("todo-list");

      function createNewTask(taskText) {
        const li = document.createElement("li");
        li.textContent = taskText;

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "delete-btn";
        deleteBtn.addEventListener("click", () => li.remove());

        li.appendChild(deleteBtn);
        return li;
      }

      function addTask(taskText, atTop = false) {
        const value = taskText.trim();
        if (!value) {
          input.focus();
          return;
        }

        const newTask = createNewTask(value);

        if (atTop) {
          todoList.prepend(newTask);
        } else {
          todoList.appendChild(newTask);
        }

        input.value = "";
        input.focus();
      }

      addBtn.addEventListener("click", () => addTask(input.value));

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          addTask(input.value);
        }
      });

      duplicateBtn.addEventListener("click", () => {
        const items = [...todoList.querySelectorAll("li")];
        const lastItem = items[items.length - 1];

        if (!lastItem) {
          return;
        }

        addTask(lastItem.firstChild.textContent);
      });

      priorityBtn.addEventListener("click", () => {
        if (!input.value.trim()) {
          const items = [...todoList.querySelectorAll("li")];
          const firstItem = items[0];

          if (!firstItem) {
            return;
          }

          addTask(firstItem.firstChild.textContent, true);
          return;
        }

        addTask(input.value, true);
      });
    </script>
  </body>
</html>
