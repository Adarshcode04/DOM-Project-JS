<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me</title>
    <style>
      body {
        background-color: rgb(42, 160, 176);
        display: flex;
        height: 100vh;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
      }
      .main {
        justify-content: center;
        background-color: rgb(234, 246, 246);
        width: 500px;
        height: 200px;
        border-radius: 10px;
        /* border : 2px solid black; */
        box-shadow: rgb(0, 0, 0, 0.35) 0px 5px 15px;
      }

      button {
        background-color: rgb(42, 160, 176);
        cursor: pointer;

        padding: 8px 14px;
        border-radius: 6px;
        border: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h1>About Me</h1>
      <p class="para1">
        I am learning DOM manipulation are building interactive web pages.
      </p>
      <button id="Edit">Edit</button>
      <button id="Save">Save</button>
    </div>

    <script>
      function textEdit() {
        let paragraph = document.querySelector(".para1");
        paragraph.contentEditable = "true";
      }

      function textSave() {
        let paragraph = document.querySelector(".para1");
        paragraph.contentEditable = "false";
      }

      let editButton = document.querySelector("#Edit");
      editButton.addEventListener("click", textEdit);

      let saveButton = document.querySelector("#Save");
      saveButton.addEventListener("click", textSave);
    </script>
  </body>
</html>
