<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Controlled Counter</title>
  </head>
  <style>
    body {
      background: #fff7f7;
      /* padding: 40px; */
      display: flex;
      height: 100vh;
      text-align: center;
      border-radius: 10px;
      justify-content: center;
      align-items: center;
    }
    .main {
      background: #f8f7f7;
      height: 400px;
      width: 500px;
      border: 2px solid black;
      border-radius: 10px;
      justify-content: center;
      align-items: center;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 50px;
      font-weight: bold;
      /* font-shadow: 2px 2px 4px #000000; */
      text-shadow: 2px 2px 4px #5c0606;
      /* background-color: aqua; */
    }
    button {
      padding: 10px;
      margin: 5px;
      justify-content: center;
      align-items: center;
      /* margin-left: 150px; */
      border-radius: 5px;
    }
    p {
      text-align: center;
      color: rgb(0, 0, 0);
      margin-bottom: 30px;
    }
  </style>
  <body>
    <div class="main">
      <h1>Keyboard Controlled Counter Game</h1>
      <p>Press A to increase, D to decrease, S to reset.</p>
      <h2 id="counter">0</h2>
      <button id="enable-counter">Enable Counter</button>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        let count = 0;
        let enabled = false;
        const score = document.getElementById("counter");
        const enableButton = document.getElementById("enable-counter");

        function updateScore() {
          score.textContent = count;
        }

        function handleKey(event) {
          if (!enabled) return;

          const key = event.key.toLowerCase();

          if (key === "a") {
            count += 1;
          } else if (key === "d") {
            count -= 1;
          } else if (key === "s") {
            count = 0;
          } else {
            return;
          }

          updateScore();
        }

        enableButton.addEventListener("click", () => {
          enabled = !enabled;
          enableButton.textContent = enabled
            ? "Counter Enabled"
            : "Enable Counter";
          enableButton.style.backgroundColor = enabled ? "#c8f7c5" : "";
        });

        window.addEventListener("keydown", handleKey);
      });
    </script>
  </body>
</html>
