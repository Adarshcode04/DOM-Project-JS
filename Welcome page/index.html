<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open page</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #e0f7ff, #f5f5f5 40%, #dfe9ff);
      }

      .openButton,
      .closeButton,
      .actionButton {
        padding: 12px 22px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .openButton:hover,
      .closeButton:hover,
      .actionButton:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .openButton {
        background: linear-gradient(135deg, #111827, #1f2937);
        color: white;
        box-shadow: 0 8px 18px rgba(17, 24, 39, 0.25);
      }

      .closeButton {
        background-color: #d62828;
        color: white;
      }

      .actionButton {
        background: linear-gradient(135deg, #111827, #374151);
        color: white;
        margin-top: 15px;
      }

      .container {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container.show {
        display: flex;
      }

      .modal {
        background-color: #ffffff;
        padding: 28px 24px 22px;
        border-radius: 14px;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
        text-align: center;
      }

      .modal h1 {
        margin-top: 0;
        margin-bottom: 12px;
        color: #111827;
      }

      .modal p {
        margin: 0 0 18px;
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <button id="openButton" class="openButton">Open Card Online</button>

    <div class="container" id="modal">
      <div class="modal">
        <h1>Welcome</h1>
        <p>Welcome to my JavaScript project gallery. Click below to continue.</p>
        <button id="closeButton" class="closeButton">Close</button>
        <button id="goButton" class="actionButton">Open Card Online</button>
      </div>
    </div>

    <script>
      const openButton = document.getElementById("openButton");
      const closeButton = document.getElementById("closeButton");
      const modal = document.getElementById("modal");

      openButton.addEventListener("click", function () {
        modal.classList.add("show");
      });

      closeButton.addEventListener("click", function () {
        modal.classList.remove("show");
      });
      modal.onclick = (e) => {
        if (e.target === modal) {
          modal.classList.remove("show");
        }
      };
    </script>
  </body>
</html>
