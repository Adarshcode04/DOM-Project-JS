<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open page</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f0f0;
      }

      .openButton,
      .closeButton,
      .actionButton {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .openButton {
        background-color: #000000;
        color: white;
      }

      .closeButton {
        background-color: #c10d00;
        color: white;
      }

      .actionButton {
        background-color: #0c0c0c;
        color: white;
        margin-top: 15px;
      }

      .container {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container.show {
        display: flex;
      }

      .modal {
        background-color: rgb(255, 255, 255);
        padding: 25px;
        border-radius: 12px;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      .modal h1 {
        margin-top: 0;
      }
    </style>
  </head>

  <body>
    <button id="openButton" class="openButton">Open Card Online</button>

    <div class="container" id="modal">
      <div class="modal">
        <h1>Welcome</h1>
        <p>This is a simple modal.</p>
        <button id="closeButton" class="closeButton">Close</button>
        <button id="goButton" class="actionButton">Open Card Online</button>
      </div>
    </div>

    <script>
      const openButton = document.getElementById("openButton");
      const closeButton = document.getElementById("closeButton");
      const modal = document.getElementById("modal");

      openButton.addEventListener("click", function () {
        modal.classList.add("show");
      });

      closeButton.addEventListener("click", function () {
        modal.classList.remove("show");
      });
      modal.onclick = (e) => {
        if (e.target === modal) {
          modal.classList.remove("show");
        }
      };
    </script>
  </body>
</html>
